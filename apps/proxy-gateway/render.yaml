# Build configuration for Render.com
# Use this file to easily deploy your Proxy Gateway for free

services:
  - type: web
    name: proxy-gateway-relay
    env: node
    plan: free
    region: singapore # Change region to be closest to Cloudflare Worker (Singapore/Oregon etc.)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/proxy/ping
