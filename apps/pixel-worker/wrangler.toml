# ============================================================
# Wrangler Configuration — FusionOps Pixel Worker
# ============================================================
# Receives sendBeacon events from LP pages at t.{domain}/e
# Stores all events in D1 for first-party analytics.
# ============================================================

name = "lp-factory-pixel"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "***CF_ACCOUNT_ID_REMOVED***"

[vars]
ENVIRONMENT = "production"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "fusionops-pixel-new-v2"
database_id = "99437cde-5e7c-4b58-97ad-69e43019c6ff"
preview_database_id = "99437cde-5e7c-4b58-97ad-69e43019c6ff"

# Worker routes — OPTIONAL only if this Worker owns t.{domain} (not lp-factory-api).
# Production stack: pixel endpoint /e is implemented on lp-factory-api; routes live in apps/api-worker/wrangler.toml.
# Uncomment and deploy here only after unassigning those routes from lp-factory-api.
#
# [[routes]]
# pattern = "t.example.com/*"
# zone_name = "example.com"

# --- Staging ---
[env.staging]
name = "lp-factory-pixel-staging"

[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "fusionops-pixel-new-v2"
database_id = "c1b8eed8-91bb-4188-bf93-59d8c6d09871"
