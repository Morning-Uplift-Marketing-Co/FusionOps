name = "lp-factory-api"
main = "src/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "ef771cfd6197dedb36bb3cea22ecf4fc"

# Keep workers.dev URL active — the SPA defaults to https://lp-factory-api.<subdomain>.workers.dev/api.
# Without this, Wrangler deploy disables the workers.dev route and the browser gets fetch NETWORK_ERROR (DNS sync, etc.).
workers_dev = true

# D1 Database binding
# CRITICAL RULE: DO NOT CHANGE THIS DATABASE. MUST USE fusionops-main-new-v2
[[d1_databases]]
binding = "DB"
database_name = "fusionops-main-new-v2"
database_id = "4eaee76d-10fb-42a7-bb9d-50737c3da785"
preview_database_id = "4eaee76d-10fb-42a7-bb9d-50737c3da785"

# Pixel events database (used by Realtime Events Dashboard)
[[d1_databases]]
binding = "PIXEL_DB"
database_name = "fusionops-pixel-new-v2"
database_id = "99437cde-5e7c-4b58-97ad-69e43019c6ff"
preview_database_id = "99437cde-5e7c-4b58-97ad-69e43019c6ff"

# Browser Rendering API — for template thumbnail screenshots
[browser]
binding = "BROWSER"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

# R2 Bucket — stores generated thumbnails
[[r2_buckets]]
binding = "THUMBS"
bucket_name = "lp-factory-thumbs"

# First-party pixel hostnames: t.{domain}/* → this Worker (see worker.js path === '/e').
# Keep in sync with Cloudflare Dashboard; duplicate on lp-factory-pixel will fail deploy (route conflict).
[[routes]]
pattern = "t.scratchpetfinancing.com/*"
zone_name = "scratchpetfinancing.com"

[[routes]]
pattern = "t.scratchcareday.com/*"
zone_name = "scratchcareday.com"

[[routes]]
pattern = "t.pawvetfund.com/*"
zone_name = "pawvetfund.com"

[[routes]]
pattern = "t.scratchpaypet.tech/*"
zone_name = "scratchpaypet.tech"

[[routes]]
pattern = "t.scratchpayeasy.com/*"
zone_name = "scratchpayeasy.com"

[[routes]]
pattern = "t.joracreditz.com/*"
zone_name = "joracreditz.com"

[[routes]]
pattern = "node.sysassets-core-delivery.com"
zone_name = "sysassets-core-delivery.com"
custom_domain = true

# When Cloudflare Worker cannot open TCP to residential proxy gateways (502), forward resolve-ip /
# dns-check / latency-check to an HTTPS relay you run (e.g. `npm run proxy-relay` on a VPS).
# Example: PROXY_RESOLVE_RELAY_URL = "https://relay.yourdomain.com"  (no trailing /api)
#
# Optional Worker var: max bytes for POST /api/templates JSON body (default 41943040 = 40 MiB).
# Set in dashboard: Workers → lp-factory-api → Settings → Variables, or wrangler secret/vars.
# TEMPLATE_POST_MAX_BYTES = "52428800"
#
# Voluum postback relay (GET t.{site}/v): optional plain-text vars (not secrets):
# DEFAULT_VOLUUM_POSTBACK_DOMAIN = "link.your-voluum-domain.com"   # used when request has no vd=
# VOLUUM_FORWARD_DOMAIN_ALLOWLIST = "voluumtrk.com,your-track-domain.com"   # if set, vd= host must match

# Proxy resolve relay (HTTPS Node gateway). No trailing slash. Override in Dashboard if you use another host.
# If the frontend uses another workers.dev name (e.g. ip-factory.*), set PROXY_RESOLVE_RELAY_URL on THAT worker too — vars are per-worker.
[vars]
PROXY_RESOLVE_RELAY_URL = "https://proxy-gateway-hrld.onrender.com"
