name: Deploy FusionOps Dashboard

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "What to deploy"
        required: true
        type: choice
        options:
          - both
          - pages-only
          - worker-only
        default: both
      callback_url:
        description: "Optional API callback URL for status update"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'apps/api-worker/**'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # Run JS-based actions (checkout, setup-node) on Node 24 — silences deprecation until runner default flips
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-worker:
    # Run on push (path filter limits to api-worker changes) OR explicit dispatch with worker-only/both.
    if: ${{ github.event_name == 'push' || inputs.deploy_target == 'both' || inputs.deploy_target == 'worker-only' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: apps/api-worker
        run: npm ci

      - name: Deploy Worker
        working-directory: apps/api-worker
        run: npx wrangler deploy
        
      - name: Summary
        run: echo "✅ Worker deployed successfully"

  deploy-pages:
    # Pages only deploys on explicit dispatch — never on push (path filter is api-worker only).
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'both' || inputs.deploy_target == 'pages-only') }}
    runs-on: ubuntu-latest
    outputs:
      deploy_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: https://lp-factory-api.misty-feather-556e.workers.dev/api

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          OUTPUT=$(npx wrangler pages deploy dist/ --project-name=fusionops-web --branch main 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' | head -n1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "✅ Pages deployed: ${{ steps.deploy.outputs.url }}"

  callback:
    needs: [deploy-worker, deploy-pages]
    if: always() && inputs.callback_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          STATUS="success"
          if [ "${{ needs.deploy-worker.result }}" = "failure" ] || [ "${{ needs.deploy-pages.result }}" = "failure" ]; then
            STATUS="failed"
          fi
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            --data "{\"status\":\"$STATUS\",\"url\":\"${{ needs.deploy-pages.outputs.deploy_url || '' }}\",\"run\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
