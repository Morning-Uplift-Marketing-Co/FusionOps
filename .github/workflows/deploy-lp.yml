name: Deploy Landing Page

# Triggered by a git push of deploy-configs/{domain}.json.
# Only needs "repo" scope on PAT — no "workflow" scope required.
# (api-worker auto-deploy lives in deploy-dashboard.yml, not here.)
on:
  push:
    paths:
      - "deploy-configs/**.json"

permissions:
  contents: read

# Serialize LP deploys to avoid hammering the Cloudflare API.
# Shared group name with deploy-dashboard.yml so *all* CF deploys on this
# account/token queue against each other (single-flight across workflows).
# Queued (never cancelled) so every pushed deploy-config eventually ships.
concurrency:
  group: cloudflare-deploy-global
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-lp:
    runs-on: ubuntu-latest
    outputs:
      deploy_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Find changed deploy config
        id: config
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'deploy-configs/*.json' 2>/dev/null | head -n1)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git show --name-only --format='' HEAD -- 'deploy-configs/*.json' | head -n1)
          fi
          if [ -z "$CHANGED" ]; then
            CHANGED=$(ls -t deploy-configs/*.json 2>/dev/null | head -n1)
          fi
          echo "file=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Using config: $CHANGED"
          cat "$CHANGED"

      - name: Parse config
        id: config_parse
        run: |
          CONFIG_FILE="${{ steps.config.outputs.file }}"
          TEMPLATE_ID=$(node -e "const c=require('./$CONFIG_FILE');console.log(c.templateId||'installment-bear')")
          CF_PAGES_PROJECT=$(node -e "const c=require('./$CONFIG_FILE');console.log(c.cfPagesProject||'lp-'+c.domain.replace(/[^a-z0-9]/g,'-'))")
          CF_API_TOKEN=$(node -e "const c=require('./$CONFIG_FILE');console.log(c.cfApiToken||'')")
          CF_ACCOUNT_ID=$(node -e "const c=require('./$CONFIG_FILE');console.log(c.cfAccountId||'')")

          echo "template_id=$TEMPLATE_ID" >> "$GITHUB_OUTPUT"
          echo "cf_pages_project=$CF_PAGES_PROJECT" >> "$GITHUB_OUTPUT"
          echo "cf_api_token=$CF_API_TOKEN" >> "$GITHUB_OUTPUT"
          echo "cf_account_id=$CF_ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "Template ID: $TEMPLATE_ID"
          echo "CF Project: $CF_PAGES_PROJECT"

      - name: Auto-detect template source and prepare directory
        id: template
        env:
          MCP_SECRET: ${{ secrets.MCP_SHARED_SECRET }}
        run: |
          TEMPLATE_ID="${{ steps.config_parse.outputs.template_id }}"
          
          # Check if physical directory exists
          if [ -d "templates/$TEMPLATE_ID" ]; then
            DIR="templates/$TEMPLATE_ID"
            echo "Using physical template directory: $DIR"
          else
            # Try legacy template mapping
            case "$TEMPLATE_ID" in
              *pet*|*scratchpay*|template10[0-9]|template11[0-9]) DIR="templates/pet_loans_v1" ;;
              installment-loans-101)                               DIR="templates/installment-loans-101" ;;
              *installment*|template12[0-9]|template13[0-9])      DIR="templates/installment-bear" ;;
              *pdl*|*lander*|template14[0-9])                     DIR="templates/pdl_new_01" ;;
              elastic-credits-v3)                                  DIR="templates/elastic-credits-v3" ;;
              *elastic*|template15[0-9])                          DIR="templates/elastic-credits-v4" ;;
              *bear*)                                              DIR="templates/bear-loan-astro" ;;
              *)                                                   DIR="" ;;
            esac
            
            if [ -n "$DIR" ] && [ -d "$DIR" ]; then
              echo "Using legacy mapped directory: $DIR"
            else
              # Template not found in filesystem - generate from D1 Database
              echo "Physical template not found, generating from D1 Database..."
              node scripts/generate-template-from-db.mjs "$TEMPLATE_ID" || exit 1
              DIR="tmp/templates/$TEMPLATE_ID"
              echo "Generated temp directory: $DIR"
            fi
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "cf_pages_project=${{ steps.config_parse.outputs.cf_pages_project }}" >> "$GITHUB_OUTPUT"
          echo "cf_api_token=${{ steps.config_parse.outputs.cf_api_token }}" >> "$GITHUB_OUTPUT"
          echo "cf_account_id=${{ steps.config_parse.outputs.cf_account_id }}" >> "$GITHUB_OUTPUT"
          echo "Final template directory: $DIR"

      - name: Install template dependencies
        working-directory: ${{ steps.template.outputs.dir }}
        run: npm install

      - name: Inject site config as env vars (Astro PUBLIC_* + Vite VITE_*)
        working-directory: ${{ steps.template.outputs.dir }}
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const configPath = path.resolve(process.env.GITHUB_WORKSPACE, process.env.CONFIG_FILE);
          const c = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          const cleanDomain = String(c.domain||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^\/\//,'').replace(/[/?#].*$/,'').replace(/\.+$/,'').replace(/^www\./,'');
          const amountMin = String(Number(String(c.amountMin||100).replace(/[^0-9.]/g,''))||100);
          const amountMax = String(Number(String(c.amountMax||5000).replace(/[^0-9.]/g,''))||5000);

          // Shared values — written as both PUBLIC_* (Astro) and VITE_* (Loveable/Vite)
          const vars = {
            BRAND:           c.brand||'',
            DOMAIN:          cleanDomain||'example.com',
            H1:              c.h1||c.brand||'',
            SUB:             c.sub||'',
            CTA:             c.cta||'Apply Now',
            TITLE2:          c.title2||'',
            PHONE:           c.phone||'',
            EMAIL:           c.email||('support@'+(c.domain||'example.com')),
            ADDRESS:         c.address||'',
            AID:             c.aid||'',
            AMOUNTMIN:       amountMin,
            AMOUNTMAX:       amountMax,
            PRIMARYCOLOR:    c.primaryColor||'#3b5bdb',
            ACCENTCOLOR:     c.accentColor||'#f97316',
            APRMIN:          String(c.aprMin||5.99),
            APRMAX:          String(c.aprMax||35.99),
            CONVERSIONID:    c.conversionId||'',
            CONVERSION_ID:   c.conversionId||'',
            FORMSTARTLABEL:  c.gtagFormStartLabel||c.formStartLabel||'',
            FORMSUBMITLABEL: c.gtagFormSubmitLabel||c.formSubmitLabel||'',
            GTAGRELAYHOST:   c.gtagRelayHost||'',
            VOLUUMID:        c.voluumId||'',
            VOLUUMDOMAIN:    c.voluumDomain||'',
            VOLUUM_CLICK_URL:c.voluumClickUrl || (c.voluumDomain ? 'https://' + c.voluumDomain + '/click' : ''),
            REDIRECT_URL:    c.voluumClickUrl || (c.voluumDomain ? 'https://' + c.voluumDomain + '/click' : '') || '/apply',
            SITE_URL:        c.siteUrl || ('https://' + (cleanDomain||'example.com')),
            META_TITLE:      c.metaTitle || c.brand || '',
            META_DESCRIPTION:c.metaDescription || c.sub || c.h1 || '',
            OG_IMAGE:        c.ogImage || ('https://' + (cleanDomain||'example.com') + '/og.png'),
            COLORID:         c.colorId||'',
            FONTID:          c.fontId||'',
            LAYOUT:          c.layout||'',
            RADIUS:          c.radius||'',
            TRUSTBADGES:     c.trustBadges||'',
            REVIEWS:         JSON.stringify(c.reviews||[]),
            SHOW_REVIEWS:    c.showReviews === false ? false : true,
          };

          // Explicit VITE_* key mapping (Loveable convention)
          const viteMap = {
            BRAND:'BRAND', DOMAIN:'DOMAIN', H1:'H1', SUB:'SUB', CTA:'CTA', TITLE2:'TITLE2',
            PHONE:'PHONE', EMAIL:'EMAIL', ADDRESS:'ADDRESS', AID:'AID',
            AMOUNTMIN:'AMOUNT_MIN', AMOUNTMAX:'AMOUNT_MAX',
            PRIMARYCOLOR:'PRIMARY_COLOR', ACCENTCOLOR:'ACCENT_COLOR',
            APRMIN:'APR_MIN', APRMAX:'APR_MAX',
            CONVERSIONID:'CONVERSION_ID', CONVERSION_ID:'CONVERSION_ID',
            FORMSTARTLABEL:'FORM_START_LABEL', FORMSUBMITLABEL:'FORM_SUBMIT_LABEL',
            GTAGRELAYHOST:'GTAG_RELAY_HOST',
            VOLUUMID:'VOLUUM_ID', VOLUUMDOMAIN:'VOLUUM_DOMAIN',
            VOLUUM_CLICK_URL:'VOLUUM_CLICK_URL',
            REDIRECT_URL:'REDIRECT_URL',
            SITE_URL:'SITE_URL', META_TITLE:'META_TITLE', META_DESCRIPTION:'META_DESCRIPTION', OG_IMAGE:'OG_IMAGE',
            COLORID:'COLOR_ID', FONTID:'FONT_ID',
            LAYOUT:'LAYOUT', RADIUS:'RADIUS',
            TRUSTBADGES:'TRUSTBADGES', REVIEWS:'REVIEWS',
            SHOW_REVIEWS:'SHOW_REVIEWS',
          };

          const lines = [];
          // dotenv-expand's regex [\w.]+ matches digits, so $500 expands to env var "500" (empty).
          // Fix: escape every $ as \$ so dotenv-expand treats them as literal dollar signs.
          // dotenv-expand strips the leading backslash, so the app sees the original $ character.
          // We use String.fromCharCode(39) for the single-quote character to avoid conflicting
          // with bash outer double-quotes in `node -e "..."`.
          // charCode constants (39=quote 36=dollar 92=backslash) bypass bash escape hazards
          const SQ = String.fromCharCode(39);
          const DOLLAR = String.fromCharCode(36);
          const BACKSLASH = String.fromCharCode(92);
          const toEnvVal = (v) => {
            const s = String(v == null ? '' : v).split(DOLLAR).join(BACKSLASH + DOLLAR);
            if (!s.includes(SQ)) return SQ + s + SQ;
            return JSON.stringify(s);
          };
          for (const [key, val] of Object.entries(vars)) {
            lines.push('PUBLIC_' + key + '=' + toEnvVal(val));
            const vk = viteMap[key] || key;
            lines.push('VITE_' + vk + '=' + toEnvVal(val));
          }

          // Merge with existing .env (preserves template-specific keys)
          const existingEnv = fs.existsSync('.env') ? fs.readFileSync('.env', 'utf8') : '';
          const newKeys = new Set(lines.map(l=>l.split('=')[0]));
          const preserved = existingEnv.split('\n').filter(l => {
            const key = l.split('=')[0];
            return key && !newKeys.has(key);
          });
          const merged = [...lines, ...preserved].join('\n');
          fs.writeFileSync('.env', merged);
          console.log('Wrote .env for domain:', c.domain, '| vars:', lines.length, '| preserved:', preserved.length);
          "
        env:
          CONFIG_FILE: ${{ steps.config.outputs.file }}

      - name: Auto-inject tracking (Voluum + Pixel + Gtag)
        working-directory: ${{ steps.template.outputs.dir }}
        run: node $GITHUB_WORKSPACE/scripts/inject-tracking.mjs .

      - name: Validate template tracking stack
        working-directory: ${{ steps.template.outputs.dir }}
        run: node $GITHUB_WORKSPACE/scripts/validate-template-tracking.mjs .

      - name: Validate Voluum DNS (pre-deploy)
        run: |
          CONFIG_FILE="${{ steps.config.outputs.file }}"
          DOMAIN=$(node -e "const c=require('./$CONFIG_FILE');const d=String(c.domain||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^\/\//,'').replace(/[/?#].*$/,'').replace(/\.+$/,'').replace(/^www\./,'');console.log(d)")
          HAS_VOLUUM=$(node -e "const c=require('./$CONFIG_FILE');const has=Boolean(String(c.voluumDomain||'').trim()||String(c.voluumClickUrl||'').trim()||String(c.voluumId||'').trim());process.stdout.write(has?'1':'')")
          if [ -z "$HAS_VOLUUM" ]; then
            echo "Skipping Voluum DNS validation: no Voluum config in $CONFIG_FILE"
            exit 0
          fi
          if [ -z "$DOMAIN" ]; then
            echo "Skipping Voluum DNS validation: domain missing after normalization"
            exit 0
          fi
          echo "Validating DNS for: $DOMAIN"
          node scripts/validate-voluum-dns.mjs --domain "$DOMAIN"
        env:
          VOLUUM_ACCESS_KEY_ID: ${{ secrets.VOLUUM_ACCESS_KEY_ID }}
          VOLUUM_ACCESS_KEY: ${{ secrets.VOLUUM_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Patch build script for CI
        working-directory: ${{ steps.template.outputs.dir }}
        run: |
          node -e "
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          let changed = false;
          // Remove 'astro check' from build (needs @astrojs/check + typescript)
          if (p.scripts?.build?.includes('astro check')) {
            p.scripts.build = p.scripts.build.replace(/astro check\s*&&?\s*/g, '').trim() || 'astro build';
            changed = true;
            console.log('Patched: removed astro check');
          }
          // Remove lovable-tagger plugin (CI-only issue)
          if (p.devDependencies?.['lovable-tagger']) {
            delete p.devDependencies['lovable-tagger'];
            changed = true;
            console.log('Patched: removed lovable-tagger');
          }
          if (changed) fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          else console.log('Build script OK:', p.scripts?.build);
          "

      - name: Build site (Astro or Vite)
        working-directory: ${{ steps.template.outputs.dir }}
        run: npm run build

      - name: Generate canonical apply.html (if missing from build)
        working-directory: ${{ steps.template.outputs.dir }}
        run: |
          CONFIG_FILE="${{ steps.config.outputs.file }}"
          AID=$(node -e "const c=require('$GITHUB_WORKSPACE/$CONFIG_FILE');console.log(c.aid||'14881')")
          BRAND=$(node -e "const c=require('$GITHUB_WORKSPACE/$CONFIG_FILE');console.log(c.brand||'Apply')")
          CID=$(node -e "const c=require('$GITHUB_WORKSPACE/$CONFIG_FILE');console.log(c.conversionId||'')")
          FSL=$(node -e "const c=require('$GITHUB_WORKSPACE/$CONFIG_FILE');console.log(c.gtagFormStartLabel||c.formStartLabel||'')")
          FSUB=$(node -e "const c=require('$GITHUB_WORKSPACE/$CONFIG_FILE');console.log(c.gtagFormSubmitLabel||c.formSubmitLabel||'')")

          # Check if apply.html already exists in dist
          if [ ! -f dist/apply.html ] && [ ! -f dist/apply/index.html ]; then
            echo "apply.html not found in build output — generating from unified-tracking module"
            node --input-type=module -e "
            import { generateApplyHtml } from '$GITHUB_WORKSPACE/packages/lp-template-generator/src/shared/unified-tracking.js';
            import fs from 'node:fs';
            const html = generateApplyHtml('${AID}', '${BRAND}', { conversionId: '${CID}', formStartLabel: '${FSL}', formSubmitLabel: '${FSUB}' });
            fs.mkdirSync('dist', { recursive: true });
            fs.writeFileSync('dist/apply.html', html);
            console.log('Generated dist/apply.html (' + html.length + ' bytes)');
            "
          else
            echo "apply.html already exists in build output — skipping generation"
          fi

          # Pages serves /apply/ from dist/apply/index.html; flat dist/apply.html alone leaves /apply/ empty.
          if [ -f dist/apply.html ] && [ ! -f dist/apply/index.html ]; then
            mkdir -p dist/apply
            cp dist/apply.html dist/apply/index.html
            echo "Mirrored dist/apply.html → dist/apply/index.html for /apply/"
          fi
          if [ -f dist/apply/index.html ] && [ ! -f dist/apply.html ]; then
            cp dist/apply/index.html dist/apply.html
            echo "Mirrored dist/apply/index.html → dist/apply.html for /apply"
          fi

      # Preflight guard — verifies the CF token and account BEFORE wrangler
      # touches the API. Catches misconfigured / revoked / wrong-scope tokens
      # in ~2s with a clear error, instead of surfacing as 10000 mid-deploy.
      - name: Preflight — verify CF token
        env:
          CF_TOKEN_FROM_CONFIG: ${{ steps.template.outputs.cf_api_token }}
          CF_ACCOUNT_FROM_CONFIG: ${{ steps.template.outputs.cf_account_id }}
          CF_TOKEN_FROM_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_FROM_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CF_TOKEN_FROM_SECRET:-$CF_TOKEN_FROM_CONFIG}"
          export CLOUDFLARE_ACCOUNT_ID="${CF_ACCOUNT_FROM_SECRET:-$CF_ACCOUNT_FROM_CONFIG}"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is empty (neither secret nor deploy-config supplied a value)."
            exit 1
          fi
          VERIFY=$(curl -sS -o /tmp/cf_verify.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "--- /user/tokens/verify (HTTP $VERIFY) ---"
          cat /tmp/cf_verify.json; echo
          if [ "$VERIFY" != "200" ] || ! node -e "const r=require('/tmp/cf_verify.json');process.exit(r.success && r.result && r.result.status==='active'?0:1)"; then
            echo "::error::CF token /verify failed (HTTP $VERIFY). Likely revoked, expired, or wrong value in secrets.CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          ACCT=$(curl -sS -o /tmp/cf_acct.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "--- /accounts/<id> (HTTP $ACCT) ---"
          cat /tmp/cf_acct.json; echo
          if [ "$ACCT" != "200" ]; then
            echo "::error::CF token cannot read account $CLOUDFLARE_ACCOUNT_ID (HTTP $ACCT). Token is scoped to a different account, or missing Account Settings:Read."
            exit 1
          fi
          echo "CF token verified and scoped to account ${CLOUDFLARE_ACCOUNT_ID:0:8}..."

      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: ${{ steps.template.outputs.dir }}
        env:
          CF_TOKEN_FROM_CONFIG: ${{ steps.template.outputs.cf_api_token }}
          CF_ACCOUNT_FROM_CONFIG: ${{ steps.template.outputs.cf_account_id }}
          CF_TOKEN_FROM_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_FROM_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CF_TOKEN_FROM_SECRET:-$CF_TOKEN_FROM_CONFIG}"
          export CLOUDFLARE_ACCOUNT_ID="${CF_ACCOUNT_FROM_SECRET:-$CF_ACCOUNT_FROM_CONFIG}"

          echo "CF Account: ${CLOUDFLARE_ACCOUNT_ID:0:8}..."
          echo "Token set: $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo YES || echo NO)"
          PROJECT="${{ steps.template.outputs.cf_pages_project }}"

          # Only call `pages project create` when the project doesn't exist yet.
          # Unconditional creates burn a separate /accounts/*/pages/projects
          # request on every deploy and contribute to 10429 rate limits.
          EXISTS=0
          if PROJECT_LIST=$(npx wrangler pages project list --json 2>/dev/null); then
            if PROJECT="$PROJECT" node -e "
              let raw='';process.stdin.on('data',d=>raw+=d).on('end',()=>{
                try{const arr=JSON.parse(raw);const want=process.env.PROJECT;
                  process.exit(arr.some(x=>x && x.name===want)?0:1)}catch{process.exit(1)}
              })" <<< "$PROJECT_LIST"; then
              EXISTS=1
            fi
          fi
          if [ "$EXISTS" = "0" ]; then
            echo "Project $PROJECT not found — creating."
            npx wrangler pages project create "$PROJECT" --production-branch=main 2>&1 || true
          else
            echo "Project $PROJECT already exists — skipping create."
          fi

          # Deploy with retry/backoff on Cloudflare rate limits (code 10429).
          # Wrangler does not retry 10429 itself, so wrap it here.
          URL=""
          MAX_ATTEMPTS=5
          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
            echo "::group::wrangler pages deploy (attempt $ATTEMPT/$MAX_ATTEMPTS)"
            if npx wrangler pages deploy dist/ \
                --project-name="$PROJECT" \
                --branch=main \
                --commit-dirty=true 2>&1 | tee /tmp/wrangler_out.txt; then
              echo "::endgroup::"
              URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler_out.txt | head -n1 || true)
              break
            fi
            echo "::endgroup::"
            if grep -Eq '10429|Rate limited|rate.?limit' /tmp/wrangler_out.txt; then
              SLEEP=$((30 * ATTEMPT))
              echo "Cloudflare rate limit hit (10429) — sleeping ${SLEEP}s before retry."
              sleep "$SLEEP"
              continue
            fi
            echo "Non-retryable wrangler failure — aborting."
            exit 1
          done
          if [ -z "$URL" ]; then
            echo "Deploy failed after $MAX_ATTEMPTS attempts (likely persistent rate limiting)."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deploy URL: $URL"

      - name: Remove stale Worker routes for domain (non-blocking)
        continue-on-error: true
        env:
          CF_TOKEN_FROM_CONFIG: ${{ steps.template.outputs.cf_api_token }}
          CF_ACCOUNT_FROM_CONFIG: ${{ steps.template.outputs.cf_account_id }}
          CF_TOKEN_FROM_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_FROM_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export CF_TOKEN="${CF_TOKEN_FROM_SECRET:-$CF_TOKEN_FROM_CONFIG}"
          export CF_ACCOUNT="${CF_ACCOUNT_FROM_SECRET:-$CF_ACCOUNT_FROM_CONFIG}"
          CONFIG_FILE="${{ steps.config.outputs.file }}"
          DOMAIN=$(node -e "const c=require('./$CONFIG_FILE');const d=String(c.domain||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^\/\//,'').replace(/[/?#].*$/,'').replace(/\.+$/,'').replace(/^www\./,'');console.log(d)")

          if [ -z "$DOMAIN" ] || [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "Skipping stale worker route cleanup: missing domain, token, or account"
            exit 0
          fi

          ZONE_RESP=$(curl -s -G "https://api.cloudflare.com/client/v4/zones" \
            --data-urlencode "name=$DOMAIN" \
            --data-urlencode "account.id=$CF_ACCOUNT" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json")
          ZONE_ID=$(ZONE_RESP="$ZONE_RESP" node -e "const r=JSON.parse(process.env.ZONE_RESP||'{}');console.log((r.result&&r.result[0]&&r.result[0].id)||'')")
          if [ -z "$ZONE_ID" ]; then
            echo "Zone lookup with account.id empty; retrying zones?name= only..."
            ZONE_RESP=$(curl -s -G "https://api.cloudflare.com/client/v4/zones" \
              --data-urlencode "name=$DOMAIN" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json")
            ZONE_ID=$(ZONE_RESP="$ZONE_RESP" node -e "const r=JSON.parse(process.env.ZONE_RESP||'{}');console.log((r.result&&r.result[0]&&r.result[0].id)||'')")
          fi

          if [ -z "$ZONE_ID" ]; then
            echo "Skipping stale worker route cleanup: zone lookup failed for $DOMAIN"
            exit 0
          fi

          ROUTES_RESP=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json")

          echo "Scanning worker routes for stale domain intercepts..."
          MATCH_IDS=$(ROUTES_JSON="$ROUTES_RESP" DOMAIN="$DOMAIN" node -e "const r=JSON.parse(process.env.ROUTES_JSON||'{}');const d=(process.env.DOMAIN||'').toLowerCase();const rows=r.result||[];const hit=rows.filter(x=>{const p=String(x.pattern||'').toLowerCase();return p===d+'/*'||p==='www.'+d+'/*'||p==='*'+d+'/*';});process.stdout.write(hit.map(x=>x.id).join(' '));")
          MATCH_INFO=$(ROUTES_JSON="$ROUTES_RESP" DOMAIN="$DOMAIN" node -e "const r=JSON.parse(process.env.ROUTES_JSON||'{}');const d=(process.env.DOMAIN||'').toLowerCase();const rows=r.result||[];const hit=rows.filter(x=>{const p=String(x.pattern||'').toLowerCase();return p===d+'/*'||p==='www.'+d+'/*'||p==='*'+d+'/*';});console.log(JSON.stringify(hit));")
          echo "Matched routes: $MATCH_INFO"

          if [ -z "$MATCH_IDS" ]; then
            echo "No stale worker routes found."
            exit 0
          fi

          for route_id in $MATCH_IDS; do
            echo "Deleting worker route $route_id"
            DEL_RESP=$(curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes/$route_id" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json")
            DEL_JSON="$DEL_RESP" node -e "const r=JSON.parse(process.env.DEL_JSON||'{}');if(!r.success){console.warn('Worker route delete failed (non-blocking):', JSON.stringify(r));process.exit(0)};console.log('Worker route delete OK:', JSON.stringify(r));"
          done

      - name: Add custom domain to CF Pages
        continue-on-error: true
        env:
          CF_TOKEN_FROM_CONFIG: ${{ steps.template.outputs.cf_api_token }}
          CF_ACCOUNT_FROM_CONFIG: ${{ steps.template.outputs.cf_account_id }}
          CF_TOKEN_FROM_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_FROM_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export CF_TOKEN="${CF_TOKEN_FROM_SECRET:-$CF_TOKEN_FROM_CONFIG}"
          export CF_ACCOUNT="${CF_ACCOUNT_FROM_SECRET:-$CF_ACCOUNT_FROM_CONFIG}"
          CONFIG_FILE="${{ steps.config.outputs.file }}"
          DOMAIN=$(node -e "const c=require('./$CONFIG_FILE');const d=String(c.domain||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^\/\//,'').replace(/[/?#].*$/,'').replace(/\.+$/,'').replace(/^www\./,'');console.log(d)")
          PROJECT="${{ steps.template.outputs.cf_pages_project }}"

          if [ -z "$DOMAIN" ] || [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "Skipping custom domain: missing domain, token, or account"
            exit 0
          fi

          if ! echo "$DOMAIN" | grep -Eq '^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}$'; then
            echo "Invalid domain in deploy config after normalization: '$DOMAIN'"
            exit 1
          fi

          echo "Adding custom domain $DOMAIN to Pages project $PROJECT..."
          # Cloudflare Pages API requires body { "name": "hostname" } (not "domain") — wrong key yields 8000015 invalid TLD
          ROOT_JSON=$(D="$DOMAIN" node -p "JSON.stringify({ name: process.env.D })")
          RESP=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT/domains" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$ROOT_JSON")
          RESP="$RESP" node -e "const r=JSON.parse(process.env.RESP||'{}');const codes=(r.errors||[]).map(e=>String(e.code));if(!(r.success||codes.includes('8000013')||codes.includes('81057'))){console.warn('CF Pages root domain attach failed (continuing to DNS upsert):', JSON.stringify(r));process.exit(0)};console.log('CF Pages root domain attach:', JSON.stringify(r));"

          echo "Adding www.$DOMAIN custom domain to Pages project $PROJECT..."
          WWW_JSON=$(D="www.$DOMAIN" node -p "JSON.stringify({ name: process.env.D })")
          RESP_WWW=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT/domains" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$WWW_JSON")
          RESP_WWW="$RESP_WWW" node -e "const r=JSON.parse(process.env.RESP_WWW||'{}');const codes=(r.errors||[]).map(e=>String(e.code));if(!(r.success||codes.includes('8000013')||codes.includes('81057'))){console.warn('CF Pages www domain attach failed (continuing to DNS upsert):', JSON.stringify(r));process.exit(0)};console.log('CF Pages www domain attach:', JSON.stringify(r));"

      - name: Upsert Cloudflare DNS CNAME (root + www)
        if: always()
        env:
          CF_TOKEN_FROM_CONFIG: ${{ steps.template.outputs.cf_api_token }}
          CF_ACCOUNT_FROM_CONFIG: ${{ steps.template.outputs.cf_account_id }}
          CF_TOKEN_FROM_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_FROM_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export CF_TOKEN="${CF_TOKEN_FROM_SECRET:-$CF_TOKEN_FROM_CONFIG}"
          export CF_ACCOUNT="${CF_ACCOUNT_FROM_SECRET:-$CF_ACCOUNT_FROM_CONFIG}"
          CONFIG_FILE="${{ steps.config.outputs.file }}"
          DOMAIN=$(node -e "const c=require('./$CONFIG_FILE');const d=String(c.domain||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^\/\//,'').replace(/[/?#].*$/,'').replace(/\.+$/,'').replace(/^www\./,'');console.log(d)")
          CF_ZONE_ID=$(node -e "const c=require('./$CONFIG_FILE');console.log(String(c.cfZoneId||'').trim().toLowerCase())")
          SKIP_DNS=$(node -e "const c=require('./$CONFIG_FILE');process.stdout.write(c.skipDnsUpsert===true?'1':'')")
          DEPLOY_URL="${{ steps.deploy.outputs.url }}"

          if [ -z "$DOMAIN" ] || [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$DEPLOY_URL" ]; then
            echo "Skipping DNS upsert: missing domain, token, account, or deploy URL"
            exit 0
          fi

          PAGES_HOST=$(node -e "console.log(new URL(process.argv[1]).hostname)" "$DEPLOY_URL")
          echo "Will point $DOMAIN and www.$DOMAIN to $PAGES_HOST"

          if [ "$SKIP_DNS" = "1" ]; then
            echo "skipDnsUpsert=true in deploy config — skipping API DNS changes."
            echo "Add proxied CNAME: $DOMAIN → $PAGES_HOST and www.$DOMAIN → $PAGES_HOST (or set cfZoneId and remove skipDnsUpsert to automate)."
            exit 0
          fi

          ZONE_ID=""
          if [ -n "$CF_ZONE_ID" ] && echo "$CF_ZONE_ID" | grep -Eq '^[a-f0-9]{32}$'; then
            echo "Trying cfZoneId from deploy config..."
            ZONE_VERIFY=$(curl -s "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json")
            ZONE_ID=$(ZONE_VERIFY="$ZONE_VERIFY" DOMAIN="$DOMAIN" ZID="$CF_ZONE_ID" node -e "
              const r=JSON.parse(process.env.ZONE_VERIFY||'{}');
              if (!r.success || !r.result?.id) process.stdout.write('');
              else {
                const want = (process.env.DOMAIN||'').toLowerCase();
                const got = String(r.result.name||'').toLowerCase();
                process.stdout.write(got === want ? process.env.ZID : '');
              }
            ")
            if [ -z "$ZONE_ID" ]; then
              echo "cfZoneId not usable (wrong id, token cannot read zone, or zone name != $DOMAIN). Falling back to lookup..."
            fi
          fi

          if [ -z "$ZONE_ID" ]; then
            ZONE_RESP=$(curl -s -G "https://api.cloudflare.com/client/v4/zones" \
              --data-urlencode "name=$DOMAIN" \
              --data-urlencode "account.id=$CF_ACCOUNT" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json")
            ZONE_ID=$(ZONE_RESP="$ZONE_RESP" node -e "const r=JSON.parse(process.env.ZONE_RESP||'{}');console.log((r.result&&r.result[0]&&r.result[0].id)||'')")
          fi
          if [ -z "$ZONE_ID" ]; then
            echo "Zone lookup with account.id returned no zone; retrying without account filter..."
            ZONE_RESP=$(curl -s -G "https://api.cloudflare.com/client/v4/zones" \
              --data-urlencode "name=$DOMAIN" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json")
            ZONE_ID=$(ZONE_RESP="$ZONE_RESP" node -e "const r=JSON.parse(process.env.ZONE_RESP||'{}');console.log((r.result&&r.result[0]&&r.result[0].id)||'')")
          fi
          if [ -z "$ZONE_ID" ]; then
            echo "Listing zones in account (first 50) for exact name match..."
            LIST_RESP=$(curl -s -G "https://api.cloudflare.com/client/v4/zones" \
              --data-urlencode "account.id=$CF_ACCOUNT" \
              --data-urlencode "per_page=50" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json")
            ZONE_ID=$(LIST_RESP="$LIST_RESP" DOMAIN="$DOMAIN" node -e "
              const r=JSON.parse(process.env.LIST_RESP||'{}');
              const d=(process.env.DOMAIN||'').toLowerCase();
              const z=(r.result||[]).find(x=>String(x.name||'').toLowerCase()===d);
              console.log(z?.id||'');
            ")
          fi
          if [ -z "$ZONE_ID" ]; then
            echo "Listing zones token can access (first 50, any account)..."
            LIST_RESP=$(curl -s -G "https://api.cloudflare.com/client/v4/zones" \
              --data-urlencode "per_page=50" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json")
            ZONE_ID=$(LIST_RESP="$LIST_RESP" DOMAIN="$DOMAIN" node -e "
              const r=JSON.parse(process.env.LIST_RESP||'{}');
              const d=(process.env.DOMAIN||'').toLowerCase();
              const z=(r.result||[]).find(x=>String(x.name||'').toLowerCase()===d);
              console.log(z?.id||'');
            ")
          fi

          if [ -z "$ZONE_ID" ]; then
            echo "::error::No Cloudflare zone for $DOMAIN — this GitHub Actions token cannot see that zone."
            echo "Note: LP Factory 'CF Profile' in the app is NOT used here. Only repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID apply."
            echo "If you use Tanongchai.wass@gmail.com in the browser, the zone may live under a different Cloudflare Account than CLOUDFLARE_ACCOUNT_ID in GitHub."
            echo "Last name-filter API response: $ZONE_RESP"
            echo "--- Diagnostics (token scope vs domain) ---"
            ACC_JSON=$(curl -s -G "https://api.cloudflare.com/client/v4/accounts" \
              --data-urlencode "per_page=20" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json")
            ZLIST_JSON=$(curl -s -G "https://api.cloudflare.com/client/v4/zones" \
              --data-urlencode "per_page=50" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json")
            TARGET_DOMAIN="$DOMAIN" CF_ACCOUNT="$CF_ACCOUNT" ACC_JSON="$ACC_JSON" ZLIST_JSON="$ZLIST_JSON" node -e "
              const acc = JSON.parse(process.env.ACC_JSON || '{}');
              const zones = JSON.parse(process.env.ZLIST_JSON || '{}');
              const want = (process.env.TARGET_DOMAIN || '').toLowerCase();
              const cfAcct = process.env.CF_ACCOUNT || '';
              if (!acc.success) console.log('GET /accounts failed:', JSON.stringify(acc.errors || acc));
              else {
                const rows = acc.result || [];
                console.log('Accounts visible to CLOUDFLARE_API_TOKEN (' + rows.length + '):');
                rows.forEach(a => console.log('  ', a.id, '|', a.name));
              }
              console.log('Workflow CLOUDFLARE_ACCOUNT_ID (must match the account that owns ' + want + '):', cfAcct);
              if (!zones.success) console.log('GET /zones failed:', JSON.stringify(zones.errors || zones));
              else {
                const zr = zones.result || [];
                console.log('Zone names this token can read (first page, ' + zr.length + '):');
                console.log(zr.map(z => z.name).join(', ') || '(none)');
                if (want && !zr.some(z => String(z.name || '').toLowerCase() === want))
                  console.log('=> \"' + want + '\" is missing above → GitHub token is for another account, or token is limited to specific zones (edit token: include this zone or All zones).');
              }
            "
            echo "---"
            echo "Fix: (1) GitHub → Settings → Secrets → set CLOUDFLARE_ACCOUNT_ID to the Account ID shown in Cloudflare for the website that has $DOMAIN"
            echo "     (2) Edit API token: Zone → Read + DNS → Edit, All zones in account (or include $DOMAIN explicitly)"
            echo "     (3) Or set deploy-config \"cfZoneId\" + token with access to that zone, or \"skipDnsUpsert\": true for manual CNAMEs"
            exit 1
          fi

          upsert_cname() {
            local fqdn="$1"
            local lookup
            lookup=$(curl -s -X GET \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$fqdn" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json")

            local rec_id
            local cname_target
            local delete_ids
            rec_id=$(LOOKUP_JSON="$lookup" node -e "const r=JSON.parse(process.env.LOOKUP_JSON||'{}');const rows=(r.result||[]).filter(x=>x.type==='CNAME');console.log(rows[0]?.id||'')")
            cname_target=$(LOOKUP_JSON="$lookup" node -e "const r=JSON.parse(process.env.LOOKUP_JSON||'{}');const rows=(r.result||[]).filter(x=>x.type==='CNAME');console.log((rows[0]?.content||'').toLowerCase())")
            delete_ids=$(LOOKUP_JSON="$lookup" node -e "const r=JSON.parse(process.env.LOOKUP_JSON||'{}');const rows=(r.result||[]).filter(x=>['A','AAAA','CNAME'].includes(x.type));process.stdout.write(rows.map(x=>x.id).join(' '))")

            if [ -n "$rec_id" ] && [ "$cname_target" = "$(printf '%s' "$PAGES_HOST" | tr '[:upper:]' '[:lower:]')" ]; then
              echo "DNS already points $fqdn to $PAGES_HOST"
              return 0
            fi

            if [ -n "$delete_ids" ]; then
              for stale_id in $delete_ids; do
                delete_resp=$(curl -s -X DELETE \
                  "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$stale_id" \
                  -H "Authorization: Bearer $CF_TOKEN" \
                  -H "Content-Type: application/json")
                DELETE_JSON="$delete_resp" node -e "const r=JSON.parse(process.env.DELETE_JSON||'{}');if(!r.success){console.error('DNS delete failed:', JSON.stringify(r));process.exit(1)};console.log('DNS delete OK:', JSON.stringify(r));"
              done
            fi

            update_resp=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"CNAME\",\"name\":\"$fqdn\",\"content\":\"$PAGES_HOST\",\"ttl\":3600,\"proxied\":true}")

            UPDATE_JSON="$update_resp" node -e "const r=JSON.parse(process.env.UPDATE_JSON||'{}');if(!r.success){console.error('DNS upsert failed:', JSON.stringify(r));process.exit(1)};console.log('DNS upsert OK:', JSON.stringify(r));"
          }

          upsert_cname "$DOMAIN"
          upsert_cname "www.$DOMAIN"

      - name: Provision pixel tracking (t.{domain} DNS + Worker route)
        env:
          CF_TOKEN_FROM_CONFIG: ${{ steps.template.outputs.cf_api_token }}
          CF_ACCOUNT_FROM_CONFIG: ${{ steps.template.outputs.cf_account_id }}
          CF_TOKEN_FROM_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_FROM_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export CF_TOKEN="${CF_TOKEN_FROM_SECRET:-$CF_TOKEN_FROM_CONFIG}"
          export CF_ACCOUNT="${CF_ACCOUNT_FROM_SECRET:-$CF_ACCOUNT_FROM_CONFIG}"
          CONFIG_FILE="${{ steps.config.outputs.file }}"
          DOMAIN=$(node -e "const c=require('./$CONFIG_FILE');const d=String(c.domain||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^\/\//,'').replace(/[/?#].*$/,'').replace(/\.+$/,'').replace(/^www\./,'');console.log(d)")
          PIXEL_SCRIPT="lp-factory-api"

          if [ -z "$DOMAIN" ]; then
            echo "No domain in deploy config — skipping pixel provisioning"
            exit 0
          fi
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID — cannot provision t.$DOMAIN tracking"
            exit 1
          fi

          ZONE_RESP=$(curl -s -G "https://api.cloudflare.com/client/v4/zones" \
            --data-urlencode "name=$DOMAIN" \
            --data-urlencode "account.id=$CF_ACCOUNT" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json")
          ZONE_ID=$(ZONE_RESP="$ZONE_RESP" node -e "const r=JSON.parse(process.env.ZONE_RESP||'{}');console.log((r.result&&r.result[0]&&r.result[0].id)||'')")
          if [ -z "$ZONE_ID" ]; then
            ZONE_RESP=$(curl -s -G "https://api.cloudflare.com/client/v4/zones" \
              --data-urlencode "name=$DOMAIN" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json")
            ZONE_ID=$(ZONE_RESP="$ZONE_RESP" node -e "const r=JSON.parse(process.env.ZONE_RESP||'{}');console.log((r.result&&r.result[0]&&r.result[0].id)||'')")
          fi
          if [ -z "$ZONE_ID" ]; then
            echo "::error::No Cloudflare zone for $DOMAIN — cannot provision t.$DOMAIN tracking route"
            exit 1
          fi

          T_FQDN="t.$DOMAIN"
          DNS_LOOKUP=$(curl -s -G "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            --data-urlencode "name=$T_FQDN" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json")
          DNS_ID=$(DNS_LOOKUP="$DNS_LOOKUP" node -e "const r=JSON.parse(process.env.DNS_LOOKUP||'{}');const row=(r.result||[]).find(x=>x.type==='A');console.log(row?.id||'')")
          DNS_BODY='{"type":"A","name":"t","content":"192.0.2.1","ttl":1,"proxied":true}'
          if [ -n "$DNS_ID" ]; then
            DNS_RESP=$(curl -s -X PUT \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$DNS_ID" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$DNS_BODY")
          else
            DNS_RESP=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$DNS_BODY")
          fi
          DNS_JSON="$DNS_RESP" node -e "const r=JSON.parse(process.env.DNS_JSON||'{}');if(!r.success){console.error('Pixel DNS upsert failed:', JSON.stringify(r));process.exit(1)};console.log('Pixel DNS OK:', JSON.stringify(r));"

          ROUTES_RESP=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json")
          PATTERN="t.$DOMAIN/*"
          ROUTE_ID=$(ROUTES_JSON="$ROUTES_RESP" PATTERN="$PATTERN" node -e "const r=JSON.parse(process.env.ROUTES_JSON||'{}');const p=process.env.PATTERN;const row=(r.result||[]).find(x=>x.pattern===p);console.log(row?.id||'')")
          ROUTE_SCRIPT=$(ROUTES_JSON="$ROUTES_RESP" PATTERN="$PATTERN" node -e "const r=JSON.parse(process.env.ROUTES_JSON||'{}');const p=process.env.PATTERN;const row=(r.result||[]).find(x=>x.pattern===p);console.log(row?.script||'')")
          ROUTE_BODY=$(PATTERN="$PATTERN" PIXEL_SCRIPT="$PIXEL_SCRIPT" node -p "JSON.stringify({pattern:process.env.PATTERN,script:process.env.PIXEL_SCRIPT})")
          if [ -n "$ROUTE_ID" ] && [ "$ROUTE_SCRIPT" = "$PIXEL_SCRIPT" ]; then
            echo "Worker route $PATTERN already points to $PIXEL_SCRIPT"
          elif [ -n "$ROUTE_ID" ]; then
            ROUTE_RESP=$(curl -s -X PUT \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes/$ROUTE_ID" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$ROUTE_BODY")
          else
            ROUTE_RESP=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$ROUTE_BODY")
          fi
          if [ -n "${ROUTE_RESP:-}" ]; then
            ROUTE_JSON="$ROUTE_RESP" node -e "const r=JSON.parse(process.env.ROUTE_JSON||'{}');if(!r.success){console.error('Pixel worker route upsert failed:', JSON.stringify(r));process.exit(1)};console.log('Pixel worker route OK:', JSON.stringify(r));"
          fi

      - name: Verify pixel endpoint (t.{domain}/e)
        env:
          CF_TOKEN_FROM_CONFIG: ${{ steps.template.outputs.cf_api_token }}
          CF_ACCOUNT_FROM_CONFIG: ${{ steps.template.outputs.cf_account_id }}
          CF_TOKEN_FROM_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_FROM_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CONFIG_FILE="${{ steps.config.outputs.file }}"
          DOMAIN=$(node -e "const c=require('./$CONFIG_FILE');const d=String(c.domain||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^\/\//,'').replace(/[/?#].*$/,'').replace(/\.+$/,'').replace(/^www\./,'');console.log(d)")
          if [ -z "$DOMAIN" ]; then
            echo "No domain — skipping pixel verify"
            exit 0
          fi
          echo "Verifying https://t.$DOMAIN/e ..."
          curl -sfI "https://t.$DOMAIN/e" --max-time 20
          curl -sf -X POST "https://t.$DOMAIN/e" \
            -H "content-type: application/json" \
            -d "{\"e\":\"deploy_verify\",\"d\":\"$DOMAIN\",\"source\":\"deploy-lp-ci\"}" \
            --max-time 20 -o /dev/null
          echo "Pixel endpoint OK for t.$DOMAIN"

      - name: Provision DNS via API Worker (fallback for multi-account)
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          CONFIG_FILE="${{ steps.config.outputs.file }}"
          DOMAIN=$(node -e "const c=require('./$CONFIG_FILE');const d=String(c.domain||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^\/\//,'').replace(/[/?#].*$/,'').replace(/\.+$/,'').replace(/^www\./,'');console.log(d)")
          DEPLOY_URL="${{ steps.deploy.outputs.url }}"

          if [ -z "$DOMAIN" ] || [ -z "$DEPLOY_URL" ]; then
            echo "Skipping API Worker DNS provision: missing domain or deploy URL"
            exit 0
          fi

          PAGES_HOST=$(node -e "console.log(new URL(process.argv[1]).hostname)" "$DEPLOY_URL")
          API_URL="https://lp-factory-api.misty-feather-556e.workers.dev/api/provision-domain-dns"

          echo "Provisioning DNS via API Worker for $DOMAIN → $PAGES_HOST"
          RESP=$(curl -s -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -H "Origin: https://fusionops-web.pages.dev" \
            -H "Referer: https://fusionops-web.pages.dev/" \
            -d "{\"domain\":\"$DOMAIN\",\"pagesHost\":\"$PAGES_HOST\"}")

          echo "$RESP" | node -e "
            const r=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            if(r.success){
              console.log('DNS provisioned via API Worker:');
              (r.records||[]).forEach(rec=>console.log('  '+rec.name+': '+rec.status+(rec.error?' ('+rec.error+')':'')));
              console.log('  Workers Route: '+r.workerRoute);
            } else {
              console.warn('API Worker DNS provision failed:', r.error||r.code||JSON.stringify(r));
            }
          " 2>/dev/null || echo "API Worker response: $RESP"

      # Requires API token with Zone → Cache Purge → Purge on this zone (or All zones).
      # Code 10000 "Authentication error" usually means the token can read DNS but cannot purge.
      - name: Purge Cloudflare Cache (post-deploy)
        if: always()
        env:
          CF_TOKEN_FROM_CONFIG: ${{ steps.template.outputs.cf_api_token }}
          CF_ACCOUNT_FROM_CONFIG: ${{ steps.template.outputs.cf_account_id }}
          CF_TOKEN_FROM_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_FROM_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export CF_TOKEN="${CF_TOKEN_FROM_SECRET:-$CF_TOKEN_FROM_CONFIG}"
          export CF_ACCOUNT="${CF_ACCOUNT_FROM_SECRET:-$CF_ACCOUNT_FROM_CONFIG}"
          CONFIG_FILE="${{ steps.config.outputs.file }}"
          DOMAIN=$(node -e "const c=require('./$CONFIG_FILE');const d=String(c.domain||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^\/\//,'').replace(/[/?#].*$/,'').replace(/\.+$/,'').replace(/^www\./,'');console.log(d)")

          if [ -z "$DOMAIN" ] || [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "Skipping cache purge: missing domain, token, or account"
            exit 0
          fi

          ZONE_RESP=$(curl -s -G "https://api.cloudflare.com/client/v4/zones" \
            --data-urlencode "name=$DOMAIN" \
            --data-urlencode "account.id=$CF_ACCOUNT" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json")
          ZONE_ID=$(ZONE_RESP="$ZONE_RESP" node -e "const r=JSON.parse(process.env.ZONE_RESP||'{}');console.log((r.result&&r.result[0]&&r.result[0].id)||'')")
          if [ -z "$ZONE_ID" ]; then
            ZONE_RESP=$(curl -s -G "https://api.cloudflare.com/client/v4/zones" \
              --data-urlencode "name=$DOMAIN" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json")
            ZONE_ID=$(ZONE_RESP="$ZONE_RESP" node -e "const r=JSON.parse(process.env.ZONE_RESP||'{}');console.log((r.result&&r.result[0]&&r.result[0].id)||'')")
          fi

          if [ -z "$ZONE_ID" ]; then
            echo "Skipping cache purge: zone lookup failed for $DOMAIN"
            echo "$ZONE_RESP"
            exit 0
          fi

          echo "Purging cache for zone $ZONE_ID ($DOMAIN)..."
          PURGE_RESP=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}')

          PURGE_JSON="$PURGE_RESP" CF_PURGE_DOMAIN="$DOMAIN" node -e "\
          const r=JSON.parse(process.env.PURGE_JSON||'{}');\
          const d=process.env.CF_PURGE_DOMAIN||'';\
          if(r.success){console.log('Cache purge OK:',JSON.stringify(r));process.exit(0);}\
          console.warn('Cache purge failed (non-blocking):',JSON.stringify(r));\
          const codes=(r.errors||[]).map(e=>Number(e.code));\
          if(codes.includes(10000)||(r.errors||[]).some(e=>/authentication|not authorized|forbidden/i.test(String(e.message||'')))){\
            console.log('');\
            console.log('::warning::CLOUDFLARE_API_TOKEN needs Zone > Cache Purge > Purge on \"'+d+'\" (or All zones). DNS Edit alone is not enough.');\
            console.log('Cloudflare Dashboard > My Profile > API Tokens > Edit token > Add permission: Zone - Cache Purge - Purge.');\
          }\
          process.exit(0);\
          "
