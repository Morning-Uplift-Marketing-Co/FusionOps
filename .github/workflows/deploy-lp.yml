name: Deploy Landing Page

on:
  push:
    paths:
      - "deploy-configs/**.json"

permissions:
  contents: read

jobs:
  deploy-lp:
    runs-on: ubuntu-latest
    outputs:
      deploy_url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find changed deploy config
        id: config
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'deploy-configs/*.json' 2>/dev/null | head -n1)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git show --name-only --format='' HEAD -- 'deploy-configs/*.json' | head -n1)
          fi
          echo "file=$CHANGED" >> "$GITHUB_OUTPUT"
          cat "$CHANGED"

      - name: Parse config and resolve template
        id: template
        run: |
          CF="${{ steps.config.outputs.file }}"
          TEMPLATE_ID=$(node -e "const c=require('./$CF');process.stdout.write(c.templateId||'installment-bear')")
          CF_PROJECT=$(node -e "const c=require('./$CF');process.stdout.write(c.cfPagesProject||'lp-'+c.domain.replace(/[^a-z0-9]/g,'-'))")
          CF_TOKEN=$(node -e "const c=require('./$CF');process.stdout.write(c.cfApiToken||'')")
          CF_ACCOUNT=$(node -e "const c=require('./$CF');process.stdout.write(c.cfAccountId||'')")
          case "$TEMPLATE_ID" in
            installment-bear*) DIR="templates/installment-bear" ;;
            *) DIR="templates/installment-bear" ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "project=$CF_PROJECT" >> "$GITHUB_OUTPUT"
          echo "cf_token=$CF_TOKEN" >> "$GITHUB_OUTPUT"
          echo "cf_account=$CF_ACCOUNT" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.template.outputs.dir }}
        run: npm install

      - name: Inject site config
        working-directory: ${{ steps.template.outputs.dir }}
        env:
          CONFIG_FILE: ${{ steps.config.outputs.file }}
        run: |
          node -e "
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync(process.env.CONFIG_FILE,'utf8'));
          const mn=String(Number(String(c.amountMin||100).replace(/[^0-9.]/g,''))||100);
          const mx=String(Number(String(c.amountMax||5000).replace(/[^0-9.]/g,''))||5000);
          const lines=[
            'PUBLIC_BRAND='+JSON.stringify(c.brand||''),
            'PUBLIC_DOMAIN='+JSON.stringify(c.domain||'example.com'),
            'PUBLIC_H1='+JSON.stringify(c.h1||c.brand||''),
            'PUBLIC_SUB='+JSON.stringify(c.sub||''),
            'PUBLIC_CTA='+JSON.stringify(c.cta||'Apply Now'),
            'PUBLIC_PHONE='+JSON.stringify(c.phone||''),
            'PUBLIC_EMAIL='+JSON.stringify(c.email||('support@'+(c.domain||'example.com'))),
            'PUBLIC_ADDRESS='+JSON.stringify(c.address||''),
            'PUBLIC_AID='+JSON.stringify(c.aid||''),
            'PUBLIC_AMOUNTMIN='+JSON.stringify(mn),
            'PUBLIC_AMOUNTMAX='+JSON.stringify(mx),
            'PUBLIC_PRIMARYCOLOR='+JSON.stringify(c.primaryColor||'#3b5bdb'),
            'PUBLIC_ACCENTCOLOR='+JSON.stringify(c.accentColor||'#f97316'),
            'PUBLIC_APRMIN='+JSON.stringify(String(c.aprMin||5.99)),
            'PUBLIC_APRMAX='+JSON.stringify(String(c.aprMax||35.99)),
          ];
          fs.writeFileSync('.env',lines.join('\n'));
          "

      - name: Build
        working-directory: ${{ steps.template.outputs.dir }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: ${{ steps.template.outputs.dir }}
        env:
          CF_TOKEN_INPUT: ${{ steps.template.outputs.cf_token }}
          CF_ACCOUNT_INPUT: ${{ steps.template.outputs.cf_account }}
          CF_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="${CF_TOKEN_INPUT:-$CF_TOKEN_SECRET}"
          export CLOUDFLARE_ACCOUNT_ID="${CF_ACCOUNT_INPUT:-$CF_ACCOUNT_SECRET}"
          echo "Token set: $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo YES || echo NO)"
          OUTPUT=$(npx wrangler pages deploy dist/ --project-name="${{ steps.template.outputs.project }}" --branch=main --commit-dirty=true 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' | head -n1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
