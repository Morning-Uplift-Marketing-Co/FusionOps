name: Deploy Landing Page

# Triggered by a git push of deploy-configs/{domain}.json
# Only needs "repo" scope on PAT — no "workflow" scope required
on:
  push:
    paths:
      - "deploy-configs/**.json"

permissions:
  contents: read

jobs:
  deploy-lp:
    runs-on: ubuntu-latest
    outputs:
      deploy_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find changed deploy config
        id: config
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'deploy-configs/*.json' 2>/dev/null | head -n1)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git show --name-only --format='' HEAD -- 'deploy-configs/*.json' | head -n1)
          fi
          if [ -z "$CHANGED" ]; then
            CHANGED=$(ls -t deploy-configs/*.json 2>/dev/null | head -n1)
          fi
          echo "file=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Using config: $CHANGED"
          cat "$CHANGED"

      - name: Parse config and resolve template
        id: template
        run: |
          CONFIG_FILE="${{ steps.config.outputs.file }}"
          TEMPLATE_ID=$(node -e "const c=require('./$CONFIG_FILE');console.log(c.templateId||'installment-bear')")
          CF_PAGES_PROJECT=$(node -e "const c=require('./$CONFIG_FILE');console.log(c.cfPagesProject||'lp-'+c.domain.replace(/[^a-z0-9]/g,'-'))")
          CF_API_TOKEN=$(node -e "const c=require('./$CONFIG_FILE');console.log(c.cfApiToken||'')")
          CF_ACCOUNT_ID=$(node -e "const c=require('./$CONFIG_FILE');console.log(c.cfAccountId||'')")

          # Map templateId → actual folder in templates/
          # Direct match takes absolute priority
          if [ -d "templates/$TEMPLATE_ID" ]; then
            DIR="templates/$TEMPLATE_ID"
          else
            case "$TEMPLATE_ID" in
              *pet*|*scratchpay*|template10[0-9]|template11[0-9]) DIR="templates/pet_loans_v1" ;;
              installment-loans-101)                               DIR="templates/installment-loans-101" ;;
              *installment*|template12[0-9]|template13[0-9])      DIR="templates/installment-bear" ;;
              *pdl*|*lander*|template14[0-9])                     DIR="templates/pdl_new_01" ;;
              elastic-credits-v3)                                  DIR="templates/elastic-credits-v3" ;;
              *elastic*|template15[0-9])                          DIR="templates/elastic-credits-v4" ;;
              *bear*)                                              DIR="templates/bear-loan-astro" ;;
              *)                                                   DIR="templates/installment-bear" ;;
            esac
          fi
          if [ ! -d "$DIR" ]; then
            echo "ERROR: Template directory not found: $DIR (templateId=$TEMPLATE_ID)"
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "cf_pages_project=$CF_PAGES_PROJECT" >> "$GITHUB_OUTPUT"
          echo "cf_api_token=$CF_API_TOKEN" >> "$GITHUB_OUTPUT"
          echo "cf_account_id=$CF_ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "Template: $TEMPLATE_ID → $DIR"
          echo "CF Project: $CF_PAGES_PROJECT"

      - name: Install template dependencies
        working-directory: ${{ steps.template.outputs.dir }}
        run: npm install

      - name: Inject site config as Astro env vars
        working-directory: ${{ steps.template.outputs.dir }}
        run: |
          node -e "
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync(process.env.CONFIG_FILE, 'utf8'));
          const amountMin = String(Number(String(c.amountMin||100).replace(/[^0-9.]/g,''))||100);
          const amountMax = String(Number(String(c.amountMax||5000).replace(/[^0-9.]/g,''))||5000);
          const lines = [
            'PUBLIC_BRAND='       + JSON.stringify(c.brand||''),
            'PUBLIC_DOMAIN='      + JSON.stringify(c.domain||'example.com'),
            'PUBLIC_H1='          + JSON.stringify(c.h1||c.brand||''),
            'PUBLIC_SUB='         + JSON.stringify(c.sub||''),
            'PUBLIC_CTA='         + JSON.stringify(c.cta||'Apply Now'),
            'PUBLIC_PHONE='       + JSON.stringify(c.phone||''),
            'PUBLIC_EMAIL='       + JSON.stringify(c.email||('support@'+(c.domain||'example.com'))),
            'PUBLIC_ADDRESS='     + JSON.stringify(c.address||''),
            'PUBLIC_AID='         + JSON.stringify(c.aid||''),
            'PUBLIC_AMOUNTMIN='   + JSON.stringify(amountMin),
            'PUBLIC_AMOUNTMAX='   + JSON.stringify(amountMax),
            'PUBLIC_PRIMARYCOLOR='+ JSON.stringify(c.primaryColor||'#3b5bdb'),
            'PUBLIC_ACCENTCOLOR=' + JSON.stringify(c.accentColor||'#f97316'),
            'PUBLIC_APRMIN='        + JSON.stringify(String(c.aprMin||5.99)),
            'PUBLIC_APRMAX='        + JSON.stringify(String(c.aprMax||35.99)),
            'PUBLIC_CONVERSIONID='    + JSON.stringify(c.conversionId||''),
            'PUBLIC_FORMSTARTLABEL='  + JSON.stringify(c.gtagFormStartLabel||c.formStartLabel||''),
            'PUBLIC_FORMSUBMITLABEL=' + JSON.stringify(c.gtagFormSubmitLabel||c.formSubmitLabel||''),
            'PUBLIC_VOLUUMID='        + JSON.stringify(c.voluumId||''),
            'PUBLIC_VOLUUMDOMAIN='  + JSON.stringify(c.voluumDomain||''),
            'PUBLIC_VOLUUM_CLICK_URL=' + JSON.stringify(c.voluumClickUrl||''),
            'PUBLIC_COLORID='       + JSON.stringify(c.colorId||''),
            'PUBLIC_FONTID='        + JSON.stringify(c.fontId||''),
            'PUBLIC_LAYOUT='        + JSON.stringify(c.layout||''),
            'PUBLIC_RADIUS='        + JSON.stringify(c.radius||''),
            'PUBLIC_TRUSTBADGES='   + JSON.stringify(c.trustBadges||''),
            'PUBLIC_REVIEWS='       + JSON.stringify(JSON.stringify(c.reviews||[])),
          ];
          fs.writeFileSync('.env', lines.join('\n'));
          console.log('Wrote .env for domain:', c.domain, 'amountMax:', amountMax);
          "
        env:
          CONFIG_FILE: ../../${{ steps.config.outputs.file }}

      - name: Validate template tracking stack
        working-directory: ${{ steps.template.outputs.dir }}
        run: node ../../scripts/validate-template-tracking.mjs .

      - name: Build Astro site
        working-directory: ${{ steps.template.outputs.dir }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: ${{ steps.template.outputs.dir }}
        env:
          CF_TOKEN_FROM_CONFIG: ${{ steps.template.outputs.cf_api_token }}
          CF_ACCOUNT_FROM_CONFIG: ${{ steps.template.outputs.cf_account_id }}
          CF_TOKEN_FROM_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_FROM_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="${CF_TOKEN_FROM_CONFIG:-$CF_TOKEN_FROM_SECRET}"
          export CLOUDFLARE_ACCOUNT_ID="${CF_ACCOUNT_FROM_CONFIG:-$CF_ACCOUNT_FROM_SECRET}"

          echo "CF Account: ${CLOUDFLARE_ACCOUNT_ID:0:8}..."
          echo "Token set: $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo YES || echo NO)"
          PROJECT="${{ steps.template.outputs.cf_pages_project }}"

          # Create project if it doesn't exist yet (ignore error if already exists)
          npx wrangler pages project create "$PROJECT" --production-branch=main 2>&1 || true

          # Deploy
          npx wrangler pages deploy dist/ \
            --project-name="$PROJECT" \
            --branch=main \
            --commit-dirty=true 2>&1 | tee /tmp/wrangler_out.txt
          cat /tmp/wrangler_out.txt
          URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler_out.txt | head -n1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deploy URL: $URL"

      - name: Add custom domain to CF Pages
        env:
          CF_TOKEN_FROM_CONFIG: ${{ steps.template.outputs.cf_api_token }}
          CF_ACCOUNT_FROM_CONFIG: ${{ steps.template.outputs.cf_account_id }}
          CF_TOKEN_FROM_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_FROM_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CF_TOKEN="${CF_TOKEN_FROM_CONFIG:-$CF_TOKEN_FROM_SECRET}"
          export CF_ACCOUNT="${CF_ACCOUNT_FROM_CONFIG:-$CF_ACCOUNT_FROM_SECRET}"
          CONFIG_FILE="${{ steps.config.outputs.file }}"
          DOMAIN=$(node -e "const c=require('./$CONFIG_FILE');console.log(c.domain||'')")
          PROJECT="${{ steps.template.outputs.cf_pages_project }}"

          if [ -z "$DOMAIN" ] || [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "Skipping custom domain: missing domain, token, or account"
            exit 0
          fi

          echo "Adding custom domain $DOMAIN to Pages project $PROJECT..."
          RESP=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT/domains" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"domain\":\"$DOMAIN\"}")
          echo "CF Pages domain result: $RESP"
          # Also try www subdomain
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT/domains" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"domain\":\"www.$DOMAIN\"}" || true
