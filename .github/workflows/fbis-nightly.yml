name: FBIS Nightly Analysis

on:
  schedule:
    - cron: '0 15 * * *'  # 22:00 Bangkok time (UTC+7)
  workflow_dispatch:        # manual trigger จาก GitHub UI

jobs:
  fbis-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # สำหรับ commit wiki กลับ repo
      id-token: write       # required by claude-code-action OIDC auth flow

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install fbis-mcp-server
        run: |
          cd apps/fbis-mcp-server
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Start fbis-mcp-server
        env:
          FBIS_API_BASE: https://lp-factory-api.misty-feather-556e.workers.dev
          FBIS_API_KEY: ${{ secrets.FBIS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MCP_PORT: '8765'
        run: |
          cd apps/fbis-mcp-server
          source .venv/bin/activate
          nohup python server.py > /tmp/fbis-mcp.log 2>&1 &
          echo "Waiting for MCP server..."
          status="000"
          for i in {1..15}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8765/mcp || true)
            if [ "$status" = "406" ] || [ "$status" = "200" ]; then
              break
            fi
            echo "Attempt $i/15: MCP not ready yet (status=$status), retrying..."
            sleep 2
          done
          if [ "$status" != "406" ] && [ "$status" != "200" ]; then
            echo "MCP readiness probe failed after retries, final status=$status"
            cat /tmp/fbis-mcp.log
            exit 1
          fi
          echo "MCP server ready ✅"

      - name: Run FBIS Analysis (Claude Code Action)
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the FBIS orchestrator. Skills are in hermes/skills/.
            Read hermes/skills/argus.skill.md, hermes/skills/nexus.skill.md,
            hermes/skills/iris.skill.md, hermes/skills/chrono.skill.md
            in parallel and execute each skill fully.
            Then read hermes/skills/verdict.skill.md and execute it.
            Finally update wiki/overview.md with today's findings and date.

      - name: Commit wiki updates
        run: |
          git config user.name "FBIS Bot"
          git config user.email "fbis-bot@fusionops.dev"
          git add wiki/
          git diff --staged --quiet || git commit -m "chore(fbis): nightly analysis $(date +'%Y-%m-%d')"
          git push
