name: Governance Check

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  governance-check:
    name: governance-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate workflow YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow_dir = Path(".github/workflows")
          failures = []

          for path in sorted(workflow_dir.glob("*.yml")):
              text = path.read_text(encoding="utf-8")
              try:
                  yaml.safe_load(text)
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("Workflow YAML validation failed:")
              for failure in failures:
                  print(f" - {failure}")
              raise SystemExit(1)

          print("Workflow YAML validation passed.")
          PY

      - name: Enforce protected branch workflow policy
        run: |
          python - <<'PY'
          from pathlib import Path

          required = {
              ".github/workflows/deploy-dashboard.yml",
              ".github/workflows/deploy-lp.yml",
              ".github/workflows/convert-vite-template.yml",
              ".github/workflows/governance-check.yml",
          }

          missing = [path for path in sorted(required) if not Path(path).exists()]
          if missing:
              print("Missing required governance workflows:")
              for path in missing:
                  print(f" - {path}")
              raise SystemExit(1)

          print("Protected branch workflow policy passed.")
          PY
