name: Convert Vite Template To Astro

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Git repository URL containing Vite template"
        required: true
        type: string
      template_id:
        description: "Output template folder id (under templates/)"
        required: true
        type: string
      template_name:
        description: "Display name used in generated index title"
        required: false
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git auth for private source repo
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          if [ -n "$SOURCE_REPO_PAT" ]; then
            git config --global url."https://x-access-token:${SOURCE_REPO_PAT}@github.com/".insteadOf "https://github.com/"
            git config --global url."https://x-access-token:${SOURCE_REPO_PAT}@github.com/".insteadOf "git@github.com:"
          else
            echo "SOURCE_REPO_PAT is empty; private source repos may fail to clone."
          fi

      - name: Convert Template
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: >
          node scripts/convert-vite-to-astro-template.mjs
          --source "${{ inputs.source_repo }}"
          --out templates
          --template-id "${{ inputs.template_id }}"
          --name "${{ inputs.template_name || inputs.template_id }}"

      - name: Validate Tracking
        run: node scripts/validate-template-tracking.mjs "templates/${{ inputs.template_id }}"

      - name: Validate Quality Gate Compatibility
        run: node scripts/validate-template-quality.mjs "templates/${{ inputs.template_id }}"

      - name: Import To Dashboard
        env:
          API_BASE: ${{ vars.API_BASE || 'https://lp-factory-api.misty-feather-556e.workers.dev' }}
          MCP_SECRET: ${{ secrets.MCP_SECRET }}
        run: >
          node scripts/upload-template.mjs "templates/${{ inputs.template_id }}"
          --id "${{ inputs.template_id }}"
          --name "${{ inputs.template_name || inputs.template_id }}"
          --source custom
          --status active

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-template-${{ inputs.template_id }}
          path: templates/${{ inputs.template_id }}
