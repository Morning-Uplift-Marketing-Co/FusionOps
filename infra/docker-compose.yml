version: "3.9"

# FusionOps Automation Stack
# Deploy on Hetzner CX22 (€4/mo) — 2vCPU, 4GB RAM
# Run: docker compose up -d

services:

  # ─── FBIS MCP Server ───────────────────────────────────────────────────────
  fbis-mcp:
    build:
      context: ../apps/fbis-mcp-server
      dockerfile: Dockerfile
    container_name: fbis-mcp
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      FBIS_API_BASE: ${FBIS_API_BASE}
      FBIS_API_KEY: ${FBIS_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      DASHCLAW_BASE_URL: ${DASHCLAW_BASE_URL}
      DASHCLAW_API_KEY: ${DASHCLAW_API_KEY}
      MCP_PORT: "8765"

  # ─── Browser MCP (Playwright) — Gmail automation, LP QA ───────────────────
  browser-mcp:
    image: node:22-slim
    container_name: browser-mcp
    restart: unless-stopped
    ports:
      - "8766:8766"
    command: >
      sh -c "npx -y @playwright/mcp --port 8766 --host 0.0.0.0"
    environment:
      DISPLAY: ":99"
    shm_size: "2gb"

  # ─── FBIS Status Dashboard — Uptime Kuma (replaces unavailable Mission Control)
  mission-control:
    image: louislam/uptime-kuma:1
    container_name: mission-control
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - mc_data:/app/data

  # ─── Graphify — Dependency Graph Visualization (Phase 5) ────────────────────
  # Analyzes codebase and visualizes dependency graphs
  # Note: Runs on port 8767 (not 8765, which is reserved for FBIS)
  graphify:
    build:
      context: ./
      dockerfile: Dockerfile.graphify
    container_name: graphify
    restart: unless-stopped
    ports:
      - "8767:8767"
    environment:
      WORKSPACE_DIR: ${GRAPHIFY_WORKSPACE:-/opt/fusionops}
      PORT: "8767"
    volumes:
      - /opt/fusionops:/workspace:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8767/mcp"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mc_data:
