version: "3.9"

# FusionOps Automation Stack
# Deploy on Hetzner CX22 (€4/mo) — 2vCPU, 4GB RAM
# Run: docker compose up -d

services:

  # ─── FBIS MCP Server ───────────────────────────────────────────────────────
  fbis-mcp:
    build:
      context: ../apps/fbis-mcp-server
      dockerfile: Dockerfile
    container_name: fbis-mcp
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      FBIS_API_BASE: ${FBIS_API_BASE}
      FBIS_API_KEY: ${FBIS_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      MCP_PORT: "8765"

  # ─── Browser MCP (Playwright) — Gmail automation, LP QA ───────────────────
  browser-mcp:
    image: node:22-slim
    container_name: browser-mcp
    restart: unless-stopped
    ports:
      - "8766:8766"
    command: >
      sh -c "npx -y @playwright/mcp --port 8766 --host 0.0.0.0"
    environment:
      DISPLAY: ":99"
    shm_size: "2gb"

  # ─── Mission Control — Orchestration Dashboard ─────────────────────────────
  mission-control:
    image: builderzlabs/mission-control:latest
    container_name: mission-control
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      AUTH_USER: ${MC_USER}
      AUTH_PASS: ${MC_PASS}
      API_KEY: ${MC_API_KEY}
      NEXT_PUBLIC_GATEWAY_OPTIONAL: "true"
    volumes:
      - mc_data:/app/data

volumes:
  mc_data:
