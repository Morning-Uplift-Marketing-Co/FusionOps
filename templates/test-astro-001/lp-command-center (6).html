/* ═══ SIMILARITY ═══ */
function similarity(a,b){let s=0;if(a.color===b.color)s++;if(a.font===b.font)s++;if(a.layout===b.layout)s++;if(a.copy===b.copy)s++;if(a.sections===b.sections)s++;return Math.round((s/5)*100);}
function fingerprintScore(v,all){if(all.length<=1)return 0;const o=all.filter(x=>x.vid!==v.vid);return o.length?Math.max(...o.map(x=>similarity(v,x))):0;}

/* ═══ FONT LOADER ═══ */
function FontLoader({fontId}){
  const ft=FONTS.find(f=>f.id===fontId);
  if(!ft)return null;
  return React.createElement('link',{rel:"stylesheet",href:`https://fonts.googleapis.com/css2?family=${ft.import}&display=swap`});
}

/* ═══ EXPORT GENERATORS ═══ */
function genJSON(cfg){
  const cs=COLOR_SCHEMES.find(c=>c.id===cfg.color)||COLOR_SCHEMES[0];
  const ft=FONTS.find(f=>f.id===cfg.font)||FONTS[0];
  const cp=COPY_SETS.find(c=>c.id===cfg.copy)||COPY_SETS[0];
  const so=(SECTION_ORDERS.find(s=>s.id===cfg.sections)||SECTION_ORDERS[0]).order;
  const rd=RADII.find(r=>r.id===cfg.radius)||RADII[0];
  const comp=COMPLIANCE_VARIANTS.find(c=>c.id===(cfg.compliance||"standard"))||COMPLIANCE_VARIANTS[0];
  // Structure matches build-variant.mjs expectations:
  // theme.brand, theme.variant, theme.domain, theme.tracking.*, theme.theme.*, theme.content.*
  return JSON.stringify({
    brand: cp.brand,
    variant: cfg.vid,
    domain: cfg.domain||"",
    email: cfg.email||"",
    tracking: {
      gads_conversion_id: cfg.gtmId||"",
      gads_labels: {
        form_start: "",
        form_submit: "",
      },
      aid: "",
      pixel_url: cfg.voluumUrl||"",
    },
    theme: {
      colors: {
        primary: hslVar(cs.primary),
        "primary-foreground": "0 0% 100%",
        secondary: hslVar(cs.secondary),
        "secondary-foreground": "0 0% 100%",
        accent: hslVar(cs.accent),
        "accent-foreground": "0 0% 100%",
        background: hslVar(cs.bg),
        foreground: hslVar(cs.fg),
        card: "0 0% 100%",
        "card-foreground": hslVar(cs.fg),
        muted: `${cs.bg[0]} ${cs.bg[1]}% ${cs.bg[2]-2}%`,
        "muted-foreground": `${cs.fg[0]} 16% 47%`,
        border: `${cs.primary[0]} 32% 91%`,
        input: `${cs.primary[0]} 32% 91%`,
        ring: hslVar(cs.primary),
      },
      font: ft.family,
      fontGoogleImport: ft.import,
      fontId: ft.id,
      radius: rd.val,
      layout: {hero:cfg.layout,sections:so},
    },
    content: {
      heroTitle: `${cp.h1} <span>${cp.h1span}</span>`,
      heroSubtitle: cp.sub,
      cta: cp.cta,
      heroStats: {
        primary: cp.badge.replace(/[^\d,+]+.*$/, "").trim(),
        text: cp.badge.replace(/^[\d,+]+\s*/, "").trim(),
      },
    },
    compliance: {
      example: comp.example,
      apr: comp.apr,
      disclaimer: comp.disclaimer.replace("{brand}",cp.brand),
    },
  },null,2);
}
